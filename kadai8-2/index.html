
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>写真の一覧</title>
</head>

<body>

    <h1>写真の一覧</h1>

    <p>以下のボタンをクリックすると、写真が一覧表示されます。</p>

    <button onclick="showPhotos()">写真を表示</button>

    <div id="photoList"></div>

    <script>
        function showPhotos() {

            const photos = [
                "images/photo_1.jpg",
                "images/photo_2.jpg",
                "images/photo_3.jpg",
                "images/photo_4.jpg",
                "images/photo_5.jpg",
                "images/photo_6.jpg",
                "images/photo_7.jpg",
                "images/photo_8.jpg"
            ];

            const list = document.getElementById("photoList");

            for (let i = 0; i < photos.length; i++) {

                list.innerHTML +=
                    '<img src="' + photos[i] + '" alt="写真" width="240">';

            }

            document.querySelector("button").remove();

        }
    </script>

</body>
</html>
