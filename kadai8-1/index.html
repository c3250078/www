<!DOCTYPE>
<html lang="ja">
<head>
    <meta charset="UTF-8">
<title>人口の多い国ランキング</title>
</head>

<body>

    <h1>人口の多い国ランキング</h1>
<ol id="countryList">
    <li>中国</li>
    <li>インド</li>
    <li>アメリカ</li>
    <li>インドネシア</li>
</ol>
<button onclick="changeCountry()">国旗で表示</button>

<script>
    function changeCountry() {
        const flags = [
        "flag_CHN.jpg",
        "flag_IND.jpg",
        "flag_USA.jpg",
        "flag_IDN.jpg"
        ];
const list = document.getElementById("countryList");

            const items = list.getElementsByTagName("li");

            for (let i = 0; i < flags.length; i++) {

                items[i].innerHTML =
                    '<img src="' + flags[i] + '" alt="国旗">';

            }
        }
    </script>

</body>
</html>
