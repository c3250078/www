
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>素数判定プログラム</title>
</head>
<body>

    <h1>100までの素数</h1>

    <p id="result"></p>

    <script>
        const n = 100;
        let output = "";

        for (let i = 2; i <= n; i++) {
            if (!isPrime(i)) continue;

            console.log(i);
            output += i + " ";
        }

        document.getElementById("result").textContent = output;

        function isPrime(n) {
            if (n <= 3) {
                return n > 1;
            } else if (n % 2 === 0 || n % 3 === 0) {
                return false;
            }

            let i = 5;

            while (i ** 2 <= n) {
                if (n % i === 0 || n % (i + 2) === 0) {
                    return false;
                }

                i += 6;
            }

            return true;
        }
    </script>

</body>
</html>
