
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>関数とアロー関数</title>
</head>
<body>

    <h1>関数とアロー関数</h1>

    <h2>1. sum関数</h2>
    <p id="sumResult"></p>

    <h2>2. fibo関数</h2>
    <p id="fiboResult"></p>

    <h2>3. betweenOrBound関数</h2>
    <p id="boundResult"></p>

    <script>
        "use strict";

        // sum関数
        let sum1;

        {
            function sum(a, b) {
                return a + b;
            }

            sum1 = sum(10, 20);
        }

        // sumのアロー関数
        let sum2;

        {
            const sum = (a, b) => a + b;

            sum2 = sum(10, 20);
        }

        document.getElementById("sumResult").textContent =
            "関数：" + sum1 + " / アロー関数：" + sum2;


        // fibo関数
        let fibo1;

        {
            function fibo(n) {
                if (n < 2) {
                    return n;
                }

                return fibo(n - 1) + fibo(n - 2);
            }

            fibo1 = fibo(10);
        }

        // fiboのアロー関数
        let fibo2;

        {
            const fibo = (n) =>
                n < 2 ? n : fibo(n - 1) + fibo(n - 2);

            fibo2 = fibo(10);
        }

        document.getElementById("fiboResult").textContent =
            "関数：" + fibo1 + " / アロー関数：" + fibo2;


        // betweenOrBound関数
        let bound1;

        {
            function betweenOrBound(low, high, n) {
                return n < low ? low : (n > high ? high : n);
            }

            bound1 = betweenOrBound(1, 10, 15);
        }

        // betweenOrBoundのアロー関数
        let bound2;

        {
            const betweenOrBound = (low, high, n) => {
                if (n >= low && n <= high) {
                    return n;
                } else if (n < low) {
                    return low;
                } else {
                    return high;
                }
            };

            bound2 = betweenOrBound(1, 10, 15);
        }

        document.getElementById("boundResult").textContent =
            "関数：" + bound1 + " / アロー関数：" + bound2;

    </script>

</body>
</html>
