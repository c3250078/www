
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>計算プログラム</title>
</head>
<body>

    <h1>計算プログラム</h1>

    <script>
        function calculateResult(op1, op2, operator) {
            let result = 0;

            switch (operator) {
                case "+":
                    result = op1 + op2;
                    break;

                case "-":
                    result = op1 - op2;
                    break;

                case "*":
                    result = op1 * op2;
                    break;

                case "/":
                    result = op1 / op2;
                    break;

                default:
                    throw new SyntaxError(
                        "演算子は「+, -, *, /」の中から選んでください"
                    );
            }

            return result;
        }

        console.log(calculateResult(10, 5, "+"));
        console.log(calculateResult(10, 5, "-"));
        console.log(calculateResult(10, 5, "*"));
        console.log(calculateResult(10, 5, "/"));
    </script>

</body>
</html>
