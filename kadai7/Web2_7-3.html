
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>計算プログラム</title>
</head>
<body>

    <h1>計算プログラム</h1>

    <p>1つ目の数字</p>
    <input type="number" id="op1" value="10">

    <p>演算子</p>
    <select id="operator">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
    </select>

    <p>2つ目の数字</p>
    <input type="number" id="op2" value="5">

    <br><br>

    <button onclick="calculate()">計算する</button>

    <h2>計算結果</h2>
    <p id="result">15</p>

    <script>
        function calculateResult(op1, op2, operator) {
            let result = 0;

            switch (operator) {
                case "+":
                    result = op1 + op2;
                    break;

                case "-":
                    result = op1 - op2;
                    break;

                case "*":
                    result = op1 * op2;
                    break;

                case "/":
                    result = op1 / op2;
                    break;

                default:
                    throw new SyntaxError(
                        "演算子は「+, -, *, /」の中から選んでください"
                    );
            }

            return result;
        }

        function calculate() {
            const op1 = Number(document.getElementById("op1").value);
            const op2 = Number(document.getElementById("op2").value);
            const operator = document.getElementById("operator").value;

            try {
                if (operator === "/" && op2 === 0) {
                    throw new Error("0では割れません");
                }

                const result = calculateResult(op1, op2, operator);

                document.getElementById("result").textContent = result;

            } catch (error) {
                document.getElementById("result").textContent = error.message;
            }
        }
    </script>

</body>
</html>
