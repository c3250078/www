<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>利用料の計算</title>

    <style>
        table {
            border-collapse: collapse;
            text-align: right;
        }

        th,td {
            border: 1px solid black;
            padding: 8px;
        } 

        th {
            background-color: #f5c6a5;
        }

        td:first-child {
            background-color: #f5c6a5;
        }

        button {
            font-size: 12px;
        }
    </style>
</head>
<body>

<h1>利用料の計算</h1>

<script>

    let a = [500,980,1200];

    let b= [10,16,8]
    function multiply(i) {
        let anser = a[i] * b[i]
        alert("料金は" + anser + "円です");
    }
    function reserve() {
        document.getElementById("status").innerHTML="予約済み";
        document.getElementById("reserveButton").remove();
        document.getElementById("message").innerHTML = "ありがとうございました"
    }
</script>

<table>
    <tr>
        <th>NO.</th>
        <th>料金(a)</th>
        <th>人数(b)</th>
        <th>a×b</th>
    </tr>

    <tr>
        <td>0</td>
        <td>500</td>
        <td>10</td>
        <td>
            <button onclick="multiply(0)">利用料の計算</button>
        </td>
    </tr>

    <tr>
        <td>1</td>
        <td>980</td>
        <td>16</td>
        <td>
            <button onclick="multiply(1)">利用料の計算</button>
        </td>
    </tr>

    <tr>
        <td>2</td>
        <td>1200</td>
        <td>8</td>
        <td>
            <button onclick="multiply(2)">利用料の計算</button>
        </td>
    </tr>
</table>

<h2>予約</h2>
<p id="status">予約受付中</p>
<button id="reserveButton" onclick="reserve()">
    予約する
</button>
<p id="message"></p>

</body>
</html>
