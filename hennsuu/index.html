<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
    <title>変数の演算</title>
</head>

<body>
<h1>変数の演算</h1>
<p>a=10, b=4の場合</p>
<script>
    let a = 10;
    let b = 4;
    function add() {
        let answer = a + b;
        alert(answer);
    }
        function subtract() {
           let answer = a - b;
           alert(answer);
       }
       function multiply() {
           let answer = a * b;
           alert(answer);
       }
       function divide() {
           let answer = a / b;
           alert(answer);
       }
</script>
<br>
<button onclick="add()">足し算</button>
<button onclick="subtract()">引き算</button>
<button onclick="multiply()">掛け算</button>
<button onclick="divide()">割り算</button>
</body>

</html>
